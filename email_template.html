<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE_TAG}}</title>
<style>
* { margin: 0; padding: 0; }
body {
  margin: 0; padding: 0;
  background-color: #F5F0E8;
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
}
.outer-wrapper {
  width: 100%;
  background-color: #F5F0E8;
  padding: 40px 0;
}
.main-table {
  width: 640px;
  margin: 0 auto;
  background-color: #FDFAF5;
  border-collapse: collapse;
}

/* ---- Header ---- */
.header-cell {
  padding: 40px 50px 30px 50px;
  background-color: #FDFAF5;
}
.brush-line {
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(139,107,74,0.3) 15%, rgba(139,107,74,0.8) 30%, rgba(139,107,74,0.6) 50%, rgba(139,107,74,0.8) 70%, rgba(139,107,74,0.3) 85%, transparent);
  margin-bottom: 35px;
}
.logo-section {
  text-align: center;
}
.logo-img {
  margin-bottom: 28px;
  display: inline-block;
  border-radius: 48% 52% 47% 53%;
  box-shadow: 0 3px 12px rgba(74,55,40,0.15);
}
.title {
  font-size: 28px;
  color: #4A3728;
  font-weight: 400;
  letter-spacing: 3px;
  line-height: 1.3;
  margin-bottom: 12px;
}
.title-brush {
  width: 140px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(139,107,74,0.5) 30%, rgba(139,107,74,0.2) 70%, transparent);
  margin: 0 auto 14px;
}
.subtitle {
  font-size: 13px;
  color: #9B8B7D;
  font-style: italic;
  letter-spacing: 1.5px;
}
.meta-row {
  padding: 0 50px 26px 50px;
  background-color: #FDFAF5;
}
.meta-text {
  font-size: 12px;
  color: #9B8B7D;
  letter-spacing: 0.5px;
}
.meta-dot {
  color: #C4A882;
  padding: 0 6px 0 10px;
}

/* ---- Date Bar ---- */
.date-bar-cell {
  padding: 0 50px 8px 50px;
  background-color: #FDFAF5;
}
.date-bar-inner {
  padding: 14px 20px;
  background-color: #F8F3EC;
  border-left: 2px solid #C4A882;
  box-shadow: inset 1px 0 0 rgba(196,168,130,0.3), inset -1px 0 0 rgba(196,168,130,0.1);
  border-radius: 0 4px 4px 0;
}
.date-bar-text {
  font-size: 13px;
  color: #4A3728;
  letter-spacing: 0.5px;
}
.date-bar-muted {
  font-size: 12px;
  color: #9B8B7D;
}
.leaf-icon {
  color: #6B8B6B;
  font-size: 14px;
  padding-right: 6px;
}

/* ---- Greeting ---- */
.greeting-cell {
  padding: 30px 50px 22px 50px;
  background-color: #FDFAF5;
}
.greeting-text {
  font-size: 15px;
  color: #3D3228;
  letter-spacing: 0.5px;
  line-height: 2;
}
.greeting-name {
  color: #4A3728;
  font-weight: 500;
}
.greeting-accent {
  color: #8B6B4A;
}

/* ---- CTA ---- */
.cta-cell {
  padding: 0 50px 36px 50px;
  background-color: #FDFAF5;
}
.cta-table {
  width: 100%;
  border-collapse: collapse;
}
.cta-btn {
  display: inline-block;
  background-color: #4A3728;
  color: #FDFAF5;
  text-decoration: none;
  font-size: 14px;
  padding: 12px 32px;
  border-radius: 3px;
  letter-spacing: 1px;
  box-shadow: 0 2px 8px rgba(74,55,40,0.2);
  text-align: left;
}

/* ---- Section Header ---- */
.section-cell {
  padding: 32px 50px 10px 50px;
  background-color: #FDFAF5;
}
.section-header-table {
  width: 100%;
  border-collapse: collapse;
}
.section-num {
  font-size: 12px;
  color: #6B8B6B;
  font-style: italic;
  letter-spacing: 1px;
  padding-bottom: 6px;
}
.section-title {
  font-size: 17px;
  color: #4A3728;
  font-weight: 400;
  letter-spacing: 1.5px;
  padding-bottom: 10px;
}
.section-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(139,107,74,0.25) 25%, rgba(139,107,74,0.25) 75%, transparent);
}

/* ---- News Items ---- */
.news-cell {
  padding: 0 50px 0 50px;
  background-color: #FDFAF5;
}
.news-table {
  width: 100%;
  border-collapse: collapse;
}
.news-row {}
.news-row-alt {
  padding-left: 4px;
}
.news-separator {
  height: 1px;
  background-color: #E8E0D5;
}
.news-item-padding {
  padding: 14px 0 14px 0;
}
.news-item-padding-alt {
  padding: 14px 0 14px 6px;
}
.news-badge {
  width: 28px;
  height: 28px;
  background-color: #E8DCC8;
  border-radius: 47% 53% 51% 49%;
  text-align: center;
  line-height: 28px;
  font-size: 12px;
  color: #4A3728;
  font-weight: 400;
}
.news-title {
  font-size: 14px;
  color: #4A3728;
  font-weight: 400;
  line-height: 1.5;
  padding-bottom: 2px;
}
.news-desc {
  font-size: 13px;
  color: #6B5D4F;
  line-height: 1.9;
  letter-spacing: 0.3px;
}

/* ---- Footer ---- */
.footer-cell {
  padding: 0;
  background-color: #4A3728;
}
.footer-top-line {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(196,168,130,0.6) 20%, rgba(196,168,130,0.4) 50%, rgba(196,168,130,0.6) 80%, transparent);
}
.footer-content {
  padding: 32px 50px 30px 50px;
  text-align: center;
}
.footer-brand {
  font-size: 16px;
  color: #C4A882;
  letter-spacing: 2px;
  padding-bottom: 10px;
  font-weight: 400;
}
.footer-desc {
  font-size: 12px;
  color: #9B8B7D;
  letter-spacing: 0.5px;
  line-height: 1.8;
  padding-bottom: 16px;
}
.footer-copyright {
  font-size: 11px;
  color: #7A6B5D;
  letter-spacing: 0.3px;
  line-height: 1.6;
}

/* ---- Responsive ---- */
@media (max-width: 640px) {
  .main-table { width: 100% !important; }
  .header-cell { padding: 30px 24px 24px 24px !important; }
  .meta-row { padding: 0 24px 20px 24px !important; }
  .date-bar-cell { padding: 0 24px 6px 24px !important; }
  .greeting-cell { padding: 24px 24px 18px 24px !important; }
  .cta-cell { padding: 0 24px 28px 24px !important; }
  .section-cell { padding: 26px 24px 8px 24px !important; }
  .news-cell { padding: 0 24px 0 24px !important; }
  .footer-content { padding: 26px 24px 24px 24px !important; }
  .title { font-size: 24px !important; }
  .cta-btn { padding: 10px 24px !important; font-size: 13px !important; }
}
</style>
</head>
